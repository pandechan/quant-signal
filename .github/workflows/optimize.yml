name: 参数优化

on:
  workflow_dispatch:
    inputs:
      days:
        description: 回测天数（留空则 15m=60天, 60m=365天）
        required: false
        default: ''

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行参数优化
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.days }}" ]; then
            ARGS="--days ${{ github.event.inputs.days }}"
          fi
          python src/optimize.py $ARGS
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TZ: UTC
