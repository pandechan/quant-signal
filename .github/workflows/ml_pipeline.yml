name: ML训练回测

on:
  schedule:
    # 每周一 UTC 0:00 自动重训练（市场变化需定期更新模型）
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 回测天数（留空则 15m=60天, 60m=365天）
        required: false
        default: ''

jobs:
  ml_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 训练+回测
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.days }}" ]; then
            ARGS="--days ${{ github.event.inputs.days }}"
          fi
          python src/ml_pipeline.py $ARGS
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TZ: UTC

      - name: 提交模型到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/lgb_model.joblib
          git commit -m "chore: 自动重训练ML模型 $(date -u +%Y-%m-%d)" || echo "无模型变更"
          git push
